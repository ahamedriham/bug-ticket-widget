name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # build.mjs fails if the template cannot be precompiled.
      - run: npm run build
      - name: dist uses the precompiled render (no runtime template)
        run: |
          grep -q "__btMakeRender" dist/bug-ticket.esm.js
          ! grep -q "template: TEMPLATE" dist/bug-ticket.esm.js
          node -e "const m = require('./dist/bug-ticket.cjs'); if (typeof m.init !== 'function') process.exit(1)"
      - run: npm publish --dry-run
